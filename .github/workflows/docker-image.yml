name: Build and Push Docker image

on:
  push:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # 🔥 necesario para subir imagen al GHCR
      id-token: write

    steps:
      # 1️⃣ Clonar el repositorio
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Configurar Java 21 (Temurin)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # 3️⃣ Compilar el proyecto sin ejecutar tests
      - name: Build with Maven (no tests)
        run: ./mvnw clean package -DskipTests

      # 4️⃣ Configurar Docker Buildx (para builds más rápidos y eficientes)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5️⃣ Iniciar sesión en GitHub Container Registry (GHCR)
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6️⃣ Convertir el owner a minúsculas (requerido por GHCR)
      - name: Set lowercase owner
        id: lowercase_owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      # 7️⃣ Construir y publicar la imagen Docker
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/market-service:latest
            ghcr.io/${{ env.OWNER_LC }}/market-service:${{ github.run_number }}

      # 8️⃣ (Opcional) Mostrar las imágenes generadas
      - name: List built images
        run: docker images ghcr.io/${{ env.OWNER_LC }}/market-service
